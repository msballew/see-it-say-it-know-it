<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>See It Say It Know It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #1B1512;
    --panel: #F6EEE0;
    --panel-ink: #241C16;
    --accent: #C68A3E;
    --accent-ink: #241C16;
    --muted: #B8A990;
    --danger: #A64B3F;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: var(--font-body);
  }

  body {
    background:
      linear-gradient(180deg, rgba(20,15,12,0.55) 0%, rgba(20,15,12,0.72) 55%, rgba(20,15,12,0.88) 100%),
      url('https://images.unsplash.com/photo-1517638851339-a711cfcf3279?fm=jpg&q=70&w=1600&auto=format&fit=crop')
      center / cover no-repeat fixed;
    color: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap { width: 100%; max-width: 380px; }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }

  .tagline {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 22px;
  }

  .panel {
    background: var(--panel);
    color: var(--panel-ink);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }

  .tab {
    flex: 1;
    padding: 9px 0;
    text-align: center;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    color: var(--panel-ink);
    background: transparent;
    border: 1px solid rgba(36,28,22,0.15);
  }
  .tab.active { background: var(--panel-ink); color: var(--panel); border-color: var(--panel-ink); }

  label {
    display: block;
    font-size: 13px;
    color: rgba(36,28,22,0.65);
    margin: 14px 0 5px;
  }
  label:first-of-type { margin-top: 0; }

  input {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    font-family: var(--font-body);
    border-radius: 8px;
    border: 1px solid rgba(36,28,22,0.2);
    background: #fff;
    color: var(--panel-ink);
  }
  input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button.action {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button.action:active { transform: translateY(1px); }

  button.signout {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    font-family: var(--font-body);
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid rgba(36,28,22,0.2);
    background: transparent;
    color: var(--panel-ink);
    cursor: pointer;
  }

  .status {
    font-size: 13px;
    color: rgba(36,28,22,0.7);
    margin-top: 12px;
    min-height: 16px;
  }
  .status.error { color: var(--danger); }

  .placeholder { font-size: 14px; color: rgba(36,28,22,0.65); line-height: 1.5; }
  .whoami { font-weight: 600; }

  .hidden { display: none; }

  .fineprint { font-size: 13px; color: rgba(36,28,22,0.6); margin: 12px 0 0; text-align: center; }
  .fineprint a { color: var(--panel-ink); }

  /* Honeypot: present in the markup for bots to find, invisible and
     unreachable by keyboard for real visitors. */
  .hp-field {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  .level-btn {
    width: 100%;
    text-align: left;
    padding: 13px 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid rgba(36,28,22,0.15);
    background: #fff;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .level-btn .level-name { font-weight: 600; font-size: 15px; }
  .level-btn .level-sub { font-size: 12px; color: rgba(36,28,22,0.55); margin-top: 2px; }
  .level-btn:disabled { opacity: 0.5; cursor: default; }

  #sceneImg {
    width: 100%;
    border-radius: 12px;
    background: #000;
    display: block;
    margin-top: 14px;
  }

  #caption {
    direction: rtl;
    text-align: right;
    font-size: 17px;
    min-height: 44px;
    background: rgba(36,28,22,0.05);
    border-radius: 8px;
    padding: 10px;
  }

  button.action.stop { background: var(--danger); color: #fff; }
  button.link {
    background: none;
    border: none;
    padding: 0;
    color: var(--panel-ink);
    text-decoration: underline;
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>See It Say It Know It</h1>
  <p class="tagline">Nobody learned to talk by studying grammar. Why start now?</p>

  <div class="panel" id="authBox">
    <div class="tabs">
      <div class="tab active" id="tabSignIn">Sign in</div>
      <div class="tab" id="tabSignUp">Sign up</div>
    </div>

    <div id="signInForm">
      <label for="siEmail">Email</label>
      <input id="siEmail" type="email" autocomplete="email" />
      <label for="siPassword">Password</label>
      <input id="siPassword" type="password" autocomplete="current-password" />
      <button class="action" id="signInBtn">Sign in</button>
    </div>

    <div id="signUpForm" class="hidden">
      <label for="suEmail">Email</label>
      <input id="suEmail" type="email" autocomplete="email" />
      <label for="suPassword">Password</label>
      <input id="suPassword" type="password" autocomplete="new-password" placeholder="6+ characters" />
      <label for="suInvite">Invite code</label>
      <input id="suInvite" type="text" autocomplete="off" />
      <button class="action" id="signUpBtn">Create account</button>
      <p class="fineprint">Don't have a code? <a href="#" id="showRequestLink">Request one</a></p>
    </div>

    <div id="requestForm" class="hidden">
      <label for="reqEmail">Email</label>
      <input id="reqEmail" type="email" autocomplete="email" />
      <label for="reqHeard">Where did you hear about this?</label>
      <input id="reqHeard" type="text" placeholder="optional" />
      <div class="hp-field" aria-hidden="true">
        <label for="reqCompany">Company</label>
        <input id="reqCompany" type="text" tabindex="-1" autocomplete="off" />
      </div>
      <button class="action" id="requestBtn">Request access</button>
      <p class="fineprint"><a href="#" id="backToSignUpLink">← back</a></p>
    </div>

    <div class="status" id="authStatus"></div>
  </div>

  <div class="panel hidden" id="appBox">
    <p class="placeholder">Signed in as <span class="whoami" id="whoami"></span>.</p>

    <div id="noCourseMsg" class="placeholder hidden">No course is set up yet — check back soon.</div>

    <div id="levelSelect" class="hidden">
      <p class="placeholder" id="levelSelectIntro">Pick a level to start:</p>
      <div id="levelList"></div>
    </div>

    <div id="lessonScreen" class="hidden">
      <p class="placeholder" id="lessonHeader"></p>

      <img id="sceneImg" class="hidden" crossorigin="anonymous" />

      <button class="action" id="startLessonBtn">Start lesson</button>
      <button class="action stop hidden" id="stopLessonBtn">End lesson</button>

      <div class="status" id="lessonStatus"></div>
      <!-- No on-screen caption of the tutor's speech, by design — see the
           note in the onmessage handler below. Left as a hidden element
           rather than removed, in case a later "reveal after recall"
           feature wants this spot. -->
      <div id="caption" class="hidden"></div>

      <button class="link" id="restartLevelBtn" style="margin-top:16px;">Restart this level</button>
      <br>
      <button class="link" id="changeLevelBtn" style="margin-top:8px;">Change level</button>
    </div>

    <button class="signout" id="signOutBtn">Sign out</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { GoogleGenAI, Modality } from "https://esm.sh/@google/genai";

const SUPABASE_URL = "https://zdkpvfpqpfrwtjjcihln.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TjDc0lyanrhpLEP0oZ2v4g_1mayEOKn";
const SIGNUP_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/signup`;
const REQUEST_ACCESS_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/request-access`;
const TOKEN_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/gemini-token`;
const MODEL = "gemini-3.1-flash-live-preview";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const authBox = document.getElementById("authBox");
const appBox = document.getElementById("appBox");
const authStatus = document.getElementById("authStatus");
const whoami = document.getElementById("whoami");

const noCourseMsg = document.getElementById("noCourseMsg");
const levelSelect = document.getElementById("levelSelect");
const levelList = document.getElementById("levelList");
const lessonScreen = document.getElementById("lessonScreen");
const lessonHeader = document.getElementById("lessonHeader");
const sceneImg = document.getElementById("sceneImg");
const startLessonBtn = document.getElementById("startLessonBtn");
const stopLessonBtn = document.getElementById("stopLessonBtn");
const lessonStatus = document.getElementById("lessonStatus");
const captionEl = document.getElementById("caption");
const restartLevelBtn = document.getElementById("restartLevelBtn");
const changeLevelBtn = document.getElementById("changeLevelBtn");

function setLessonStatus(text, isError = false) {
  lessonStatus.textContent = text;
  lessonStatus.classList.toggle("error", isError);
}

const tabSignIn = document.getElementById("tabSignIn");
const tabSignUp = document.getElementById("tabSignUp");
const signInForm = document.getElementById("signInForm");
const signUpForm = document.getElementById("signUpForm");
const requestForm = document.getElementById("requestForm");

function setStatus(text, isError = false) {
  authStatus.textContent = text;
  authStatus.classList.toggle("error", isError);
}

tabSignIn.onclick = () => {
  tabSignIn.classList.add("active");
  tabSignUp.classList.remove("active");
  signInForm.classList.remove("hidden");
  signUpForm.classList.add("hidden");
  requestForm.classList.add("hidden");
  setStatus("");
};
tabSignUp.onclick = () => {
  tabSignUp.classList.add("active");
  tabSignIn.classList.remove("active");
  signUpForm.classList.remove("hidden");
  signInForm.classList.add("hidden");
  requestForm.classList.add("hidden");
  setStatus("");
};

// ---------- Course / level / lesson state ----------
let currentUser = null;
let currentCourse = null;   // { id, native_language, target_language, name }

async function showSignedIn() {
  const { data: { user } } = await supabase.auth.getUser();
  currentUser = user;
  whoami.textContent = user?.email || "";
  authBox.classList.add("hidden");
  appBox.classList.remove("hidden");
  await loadCourseAndRoute();
}

// Only one course exists right now (English -> Hebrew), but this fetches
// it from the database rather than assuming it — a second course (a new
// native language) is a new row, and this picks it up with zero code
// changes. If more than one ever exists, this just uses the first; a real
// course-picker screen is future work for when that's actually true.
async function loadCourseAndRoute() {
  levelSelect.classList.add("hidden");
  lessonScreen.classList.add("hidden");
  noCourseMsg.classList.add("hidden");

  const { data: courses, error } = await supabase.from("courses").select("*").limit(1);
  if (error || !courses || courses.length === 0) {
    noCourseMsg.classList.remove("hidden");
    return;
  }
  currentCourse = courses[0];

  const { data: progress } = await supabase
    .from("user_course_progress")
    .select("level_id, lesson_number")
    .eq("course_id", currentCourse.id)
    .maybeSingle();

  if (progress) {
    showLessonScreen(progress.level_id, progress.lesson_number);
  } else {
    showLevelSelect();
  }
}

async function showLevelSelect() {
  lessonScreen.classList.add("hidden");
  levelSelect.classList.remove("hidden");
  levelList.innerHTML = "Loading levels...";

  const { data: levels } = await supabase
    .from("levels").select("id, name, sort_order")
    .eq("course_id", currentCourse.id).order("sort_order");

  levelList.innerHTML = "";
  for (const level of (levels || [])) {
    const { count } = await supabase
      .from("lessons").select("*", { count: "exact", head: true })
      .eq("level_id", level.id);

    const btn = document.createElement("button");
    btn.className = "level-btn";
    btn.innerHTML = `<div class="level-name">${level.name}</div><div class="level-sub">${count ? `${count} lesson${count === 1 ? "" : "s"}` : "Coming soon"}</div>`;
    if (!count) {
      btn.disabled = true;
    } else {
      btn.onclick = () => selectLevel(level.id);
    }
    levelList.appendChild(btn);
  }
}

async function selectLevel(levelId) {
  const { error } = await supabase.from("user_course_progress").upsert(
    { user_id: currentUser.id, course_id: currentCourse.id, level_id: levelId, lesson_number: 1 },
    { onConflict: "user_id,course_id" }
  );
  if (error) { alert(`Couldn't save your level choice: ${error.message}`); return; }
  showLessonScreen(levelId, 1);
}

async function showLessonScreen(levelId, lessonNumber) {
  levelSelect.classList.add("hidden");
  lessonScreen.classList.remove("hidden");

  const { data: level } = await supabase.from("levels").select("name").eq("id", levelId).single();
  const { data: lesson } = await supabase
    .from("lessons").select("title, is_checkpoint")
    .eq("level_id", levelId).eq("lesson_number", lessonNumber).single();

  lessonHeader.textContent = `${level?.name || "Level"} — Lesson ${lessonNumber}${lesson?.title ? `: ${lesson.title}` : ""}${lesson?.is_checkpoint ? " (review)" : ""}`;
}

restartLevelBtn.onclick = async () => {
  if (liveSession) stopLesson();
  const { data: progress } = await supabase
    .from("user_course_progress").select("level_id")
    .eq("course_id", currentCourse.id).maybeSingle();
  if (!progress) return;
  if (!confirm("Restart this level from Lesson 1?")) return;
  await supabase.from("user_course_progress").upsert(
    { user_id: currentUser.id, course_id: currentCourse.id, level_id: progress.level_id, lesson_number: 1 },
    { onConflict: "user_id,course_id" }
  );
  showLessonScreen(progress.level_id, 1);
};

changeLevelBtn.onclick = () => {
  if (liveSession) stopLesson();
  showLevelSelect();
};

// ---------- Lesson session: Gemini Live audio/video + function calls ----------
let mediaStream = null;
let audioCtx = null;
let playCtx = null;
let nextPlayTime = 0;
let scriptNode = null;
let videoTimer = null;
let liveSession = null;
let currentSessionId = null;
let currentSceneUrl = null;
let currentTranscript = "";
let transcriptNeedsReset = false;

function downsampleTo16k(float32Array, inputSampleRate) {
  if (inputSampleRate === 16000) return float32Array;
  const ratio = inputSampleRate / 16000;
  const newLength = Math.round(float32Array.length / ratio);
  const result = new Float32Array(newLength);
  for (let i = 0; i < newLength; i++) {
    const srcIndex = i * ratio;
    const i0 = Math.floor(srcIndex);
    const i1 = Math.min(i0 + 1, float32Array.length - 1);
    const t = srcIndex - i0;
    result[i] = float32Array[i0] * (1 - t) + float32Array[i1] * t;
  }
  return result;
}

function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  for (let i = 0, offset = 0; i < float32Array.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return buffer;
}

function arrayBufferToBase64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function playIncomingAudio(base64Data) {
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

  const audioBuffer = playCtx.createBuffer(1, float32.length, 24000);
  audioBuffer.copyToChannel(float32, 0);

  const source = playCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(playCtx.destination);

  const now = playCtx.currentTime;
  const startAt = Math.max(now, nextPlayTime);
  source.start(startAt);
  nextPlayTime = startAt + audioBuffer.duration;
}

// Handles the two function-calling tools declared in gemini-token: records
// word-level results, and moves the lesson within the current level. Each
// call must get a response sent back or the model will stall waiting for
// one.
//
// UNVERIFIED (no network access to test against a live key): the exact
// shape of an incoming tool-call message (`message.toolCall.functionCalls`)
// and the method to reply (`liveSession.sendToolResponse(...)`) are per
// current Gemini Live API docs, not confirmed against this specific
// @google/genai SDK version. If tool calls silently don't fire, or the
// model seems to hang after one, check the SDK's actual shape first —
// this is the single biggest risk in this file.
async function handleToolCall(toolCall) {
  const responses = [];
  for (const call of (toolCall.functionCalls || [])) {
    let result = { ok: true };
    try {
      if (call.name === "record_word_result") {
        const { word, tier, result: outcome } = call.args || {};
        const { error } = await supabase.rpc("record_word_progress", {
          p_course_id: currentCourse.id,
          p_language: currentCourse.target_language,
          p_word: word,
          p_tier: tier || 0,
          p_result: outcome,
          p_session_id: currentSessionId,
        });
        if (error) result = { ok: false, error: error.message };
      } else if (call.name === "advance_lesson") {
        const { direction } = call.args || {};
        const { data, error } = await supabase.rpc("advance_lesson", {
          p_course_id: currentCourse.id,
          p_direction: direction,
        });
        if (error) result = { ok: false, error: error.message };
        else result = { ok: true, new_lesson_number: data };
      }
    } catch (e) {
      result = { ok: false, error: String(e) };
    }
    responses.push({ id: call.id, name: call.name, response: result });
  }
  if (responses.length && liveSession) {
    liveSession.sendToolResponse({ functionResponses: responses });
  }
}

async function startLesson() {
  startLessonBtn.disabled = true;
  setLessonStatus("Requesting mic...");
  currentTranscript = "";
  transcriptNeedsReset = false;

  try {
    const audioConstraints = { channelCount: 1, echoCancellation: true, noiseSuppression: true };
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
  } catch (e) {
    setLessonStatus(`Couldn't access mic: ${e.message}`, true);
    startLessonBtn.disabled = false;
    return;
  }

  setLessonStatus("Getting a session key...");
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    // Happens when the sign-in has actually expired or was cleared (e.g. a
    // tab left open overnight, or signed out in another tab sharing the
    // same browser storage) — previously this crashed with a raw
    // "Cannot read properties of null (reading 'access_token')" instead of
    // saying what actually happened.
    mediaStream.getTracks().forEach((t) => t.stop());
    startLessonBtn.disabled = false;
    setStatus("Your sign-in has expired — please sign in again.", true);
    appBox.classList.add("hidden");
    authBox.classList.remove("hidden");
    currentCourse = null;
    currentUser = null;
    return;
  }
  const resp = await fetch(TOKEN_FUNCTION_URL, {
    method: "POST",
    headers: { Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ course_id: currentCourse.id }),
  });
  if (!resp.ok) {
    setLessonStatus(`Couldn't start lesson: ${await resp.text()}`, true);
    startLessonBtn.disabled = false;
    mediaStream.getTracks().forEach((t) => t.stop());
    return;
  }
  const lessonData = await resp.json();
  currentSessionId = lessonData.sessionId;

  // Scene, if this lesson has one attached — otherwise the session runs
  // audio-only. There is no live camera feed; the tutor sees only the
  // curated scene photo, never the learner's own surroundings.
  currentSceneUrl = lessonData.scene?.image_url || null;
  if (currentSceneUrl) {
    sceneImg.src = currentSceneUrl;
    sceneImg.classList.remove("hidden");
  }

  setLessonStatus("Connecting...");
  // TEMPORARY DIAGNOSTIC — using the real API key instead of the ephemeral
  // token, to confirm a real, currently-open Google bug: ephemeral-token
  // Live API sessions silently ignore systemInstruction (confirmed by
  // multiple independent reports — discuss.ai.google.dev/t/
  // live-api-with-ephemeral-token-ignores-the-system-instruction/113346 —
  // matching exactly what we saw: generic non-tutor responses despite a
  // correctly-sent systemInstruction). This line MUST be reverted back to
  // the ephemeral-token version below before this goes anywhere near real
  // users — it exposes the real Gemini API key in the browser.
  //
  // REVERT TO:
  // const ai = new GoogleGenAI({ apiKey: lessonData.token, httpOptions: { apiVersion: "v1alpha" } });
  const ai = new GoogleGenAI({ apiKey: lessonData.diagnosticApiKey });

  liveSession = await ai.live.connect({
    model: MODEL,
    config: {
      responseModalities: [Modality.AUDIO],
      outputAudioTranscription: {},
      // The tutor's persona + this lesson's real content, and the two
      // function-calling tools — minted server-side in gemini-token, sent
      // here rather than locked into the ephemeral token itself. See the
      // VERIFIED note in gemini-token/index.ts for why.
      systemInstruction: { parts: [{ text: lessonData.systemInstruction }] },
      tools: lessonData.tools,
    },
    callbacks: {
      onopen: () => setLessonStatus("Connected — starting..."),
      onmessage: (message) => {
        const content = message.serverContent;
        // outputTranscription arrives as a stream of small chunks across a
        // turn, not the full sentence each time — confirmed by Google's own
        // Live API reference ("the last output transcription of this turn
        // is sent before generationComplete/interrupted, which are followed
        // by turnComplete"). Replacing the caption with just each incoming
        // chunk (the previous behavior) is what made it look like random
        // words flashing by — this accumulates them into the full sentence
        // instead, and only clears once the next turn's speech starts.
        // Per persona.md's own design ("Text never appears on screen until
        // after successful recall — this is an audio-first method, not a
        // read-along"), the tutor's speech is never shown as on-screen
        // captions — that's the whole pedagogical point of a live audio
        // tutor. Logged to the console instead, so we can still verify
        // what was said while testing without putting it on screen.
        if (content?.outputTranscription?.text) {
          if (transcriptNeedsReset) {
            currentTranscript = "";
            transcriptNeedsReset = false;
          }
          currentTranscript += content.outputTranscription.text;
          console.log("[tutor]", currentTranscript);
        }
        if (content?.turnComplete) {
          transcriptNeedsReset = true;
        }
        const parts = content?.modelTurn?.parts || [];
        for (const part of parts) {
          if (part.inlineData?.data) playIncomingAudio(part.inlineData.data);
        }
        if (message.toolCall) handleToolCall(message.toolCall);
      },
      onerror: (e) => setLessonStatus(`Error: ${e.message}`, true),
      onclose: (e) => setLessonStatus(`Closed: ${e.reason || "session ended"}`),
    },
  });

  // Kick the tutor off. Without this, the Live API sits silently waiting
  // for the learner to speak first — even with a system instruction saying
  // to start right away, it won't produce a turn on its own. This is a
  // widely-reported gap, not specific to this app (Google AI Developer
  // Forum: "Can't make the model start speaking..."; googleapis/python-genai
  // issue #1533, "model can't initiate the conversation"). The confirmed
  // workaround, and the one used here: send a trivial client-content turn
  // right after connecting so the model's *response* to it is what actually
  // opens the lesson, driven by the system instruction — the learner never
  // sees this line, only the tutor's reply to it.
  liveSession.sendClientContent({
    turns: [{ role: "user", parts: [{ text: "(the learner has just joined — begin the lesson)" }] }],
    turnComplete: true,
  });

  // ---- Mic capture: downsample to 16kHz mono PCM16, stream continuously ----
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const micSource = audioCtx.createMediaStreamSource(mediaStream);
  scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
  micSource.connect(scriptNode);
  scriptNode.connect(audioCtx.destination);
  scriptNode.onaudioprocess = (e) => {
    const input = e.inputBuffer.getChannelData(0);
    const down = downsampleTo16k(input, audioCtx.sampleRate);
    const pcm = floatTo16BitPCM(down);
    liveSession.sendRealtimeInput({
      audio: { data: arrayBufferToBase64(pcm), mimeType: "audio/pcm;rate=16000" },
    });
  };

  playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  nextPlayTime = 0;

  // ---- Frame source: the lesson's curated scene photo, sent once as a still frame ----
  // (Not a live feed — just enough for the tutor to reference what's in the
  // photo. Re-sent on an interval only because the Live API expects video
  // input as a stream; the image itself never changes mid-lesson.)
  if (currentSceneUrl) {
    const canvas = document.createElement("canvas");
    const ctx2d = canvas.getContext("2d");
    videoTimer = setInterval(() => {
      const w = sceneImg.naturalWidth;
      const h = sceneImg.naturalHeight;
      if (!w) return;
      canvas.width = w;
      canvas.height = h;
      try {
        ctx2d.drawImage(sceneImg, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
        const base64 = dataUrl.split(",")[1];
        liveSession.sendRealtimeInput({ video: { data: base64, mimeType: "image/jpeg" } });
      } catch (err) {
        // Most likely a canvas-tainting error from a cross-origin scene
        // image without proper CORS headers.
        setLessonStatus(`Frame capture error: ${err.message}`, true);
      }
    }, 1000);
  }

  startLessonBtn.classList.add("hidden");
  stopLessonBtn.classList.remove("hidden");
}

async function stopLesson() {
  if (videoTimer) clearInterval(videoTimer);
  if (scriptNode) scriptNode.disconnect();
  if (audioCtx) audioCtx.close();
  if (playCtx) playCtx.close();
  if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
  if (liveSession) liveSession.close();

  if (currentSessionId) {
    await supabase.from("sessions").update({ ended_at: new Date().toISOString() }).eq("id", currentSessionId);
  }

  setLessonStatus("Ended.");
  captionEl.textContent = "";
  currentTranscript = "";
  transcriptNeedsReset = false;
  sceneImg.classList.add("hidden");
  startLessonBtn.disabled = false;
  startLessonBtn.classList.remove("hidden");
  stopLessonBtn.classList.add("hidden");
  liveSession = null;
  currentSessionId = null;
}

startLessonBtn.onclick = () => startLesson().catch((e) => setLessonStatus(`Error: ${e.message}`, true));
stopLessonBtn.onclick = () => stopLesson();

document.getElementById("signInBtn").onclick = async () => {
  const email = document.getElementById("siEmail").value.trim();
  const password = document.getElementById("siPassword").value;
  setStatus("Signing in...");
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { setStatus(error.message, true); return; }
  showSignedIn();
};

document.getElementById("signUpBtn").onclick = async () => {
  const email = document.getElementById("suEmail").value.trim();
  const password = document.getElementById("suPassword").value;
  const invite_code = document.getElementById("suInvite").value.trim();

  if (!email || !password || !invite_code) {
    setStatus("All three fields are required.", true);
    return;
  }

  setStatus("Creating your account...");
  const resp = await fetch(SIGNUP_FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, invite_code }),
  });
  const result = await resp.json();
  if (!resp.ok) {
    setStatus(result.error || "Something went wrong creating the account.", true);
    return;
  }

  setStatus("Account created — signing you in...");
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) { setStatus(`Account created, but sign-in failed: ${error.message}`, true); return; }
  showSignedIn();
};

document.getElementById("showRequestLink").onclick = (e) => {
  e.preventDefault();
  signUpForm.classList.add("hidden");
  requestForm.classList.remove("hidden");
  setStatus("");
};
document.getElementById("backToSignUpLink").onclick = (e) => {
  e.preventDefault();
  requestForm.classList.add("hidden");
  signUpForm.classList.remove("hidden");
  setStatus("");
};

document.getElementById("requestBtn").onclick = async () => {
  const email = document.getElementById("reqEmail").value.trim();
  const heard_about = document.getElementById("reqHeard").value.trim();
  const company = document.getElementById("reqCompany").value; // honeypot
  const ref = new URLSearchParams(window.location.search).get("ref") || undefined;

  if (!email) { setStatus("An email is required.", true); return; }

  setStatus("Sending your request...");
  const resp = await fetch(REQUEST_ACCESS_FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, heard_about, company, origin: window.location.origin, ref }),
  });
  const result = await resp.json();
  if (!resp.ok) {
    setStatus(result.error || "Something went wrong sending your request.", true);
    return;
  }
  setStatus("Request sent — check your email to confirm, and watch for an invite code.");
};

document.getElementById("signOutBtn").onclick = async () => {
  if (liveSession) await stopLesson();
  await supabase.auth.signOut();
  levelSelect.classList.add("hidden");
  lessonScreen.classList.add("hidden");
  noCourseMsg.classList.add("hidden");
  currentCourse = null;
  currentUser = null;
  appBox.classList.add("hidden");
  authBox.classList.remove("hidden");
  setStatus("");
};

supabase.auth.getSession().then(({ data }) => {
  if (data.session) showSignedIn();
});
</script>
</body>
</html>
